    <style>
        /* =========================================
           TEST SETUP DARK THEME OVERRIDES
           ========================================= */
        .setup-card { 
            background: var(--bg-card); 
            border-radius: var(--radius-lg); 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            max-width: 600px; 
            margin: 40px auto; 
            border: 1px solid var(--border-color);
            border-top: 6px solid var(--accent-blue); 
        }
        
        .setup-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        
        .tab-btn { 
            flex: 1; 
            padding: 14px; 
            border: 1px solid var(--border-color); 
            background: var(--bg-card-hover); 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            font-weight: 600; 
            color: var(--text-secondary); 
            font-size: 15px; 
            transition: 0.2s; 
        }
        .tab-btn:hover { border-color: var(--accent-blue); color: var(--text-primary); }
        .tab-btn.active { border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        
        .setup-section { display: none; animation: fadeIn 0.3s ease; }
        .setup-section.active { display: block; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { font-weight: 600; margin-bottom: 8px; display: block; color: var(--text-primary); font-size: 14px; }
        
        .input-group select, .input-group input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border-color); 
            font-size: 15px; 
            color: var(--text-primary); 
            background: var(--bg-main); 
            outline: none; 
            box-sizing: border-box; 
            transition: border-color 0.2s; 
        }
        .input-group select:focus, .input-group input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .input-group select:disabled, .input-group input:disabled { background: var(--bg-card-hover); cursor: not-allowed; color: var(--text-secondary); opacity: 0.7; }
        
        .start-btn { 
            width: 100%; 
            background: var(--accent-blue); 
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: var(--radius-md); 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: 0.2s; 
        }
        .start-btn:hover:not(:disabled) { background: #2563EB; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); transform: translateY(-2px); }
        .start-btn:disabled { background: var(--bg-card-hover); color: var(--text-secondary); border: 1px solid var(--border-color); cursor: not-allowed; transform: none; }
        
        .live-counter { 
            background: rgba(16, 185, 129, 0.1); 
            border: 1px solid rgba(16, 185, 129, 0.3); 
            color: #10b981; 
            padding: 12px 16px; 
            border-radius: var(--radius-md); 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .live-counter.error { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #ef4444; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body id="home-body">

    <!-- ==========================================
         UNIVERSAL HEADER & SIDEBAR 
         ========================================== -->
    <header class="site-header">
        <a href="index.html" class="logo">
            <h2>Doubt Factory</h2>
            <p>Turning Doubts into Clarity</p>
        </a>

        <!-- Hamburger Icon -->
        <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open Menu">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <!-- Sidebar Navigation -->
        <nav aria-label="Primary navigation" id="primaryNav">
            <button id="closeMenuBtn" class="close-menu-btn" aria-label="Close Menu">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <a href="index.html">Home</a>
            
            <div class="nav-item-dropdown">
                <a tabindex="0" class="drop-trigger">Exams ▾</a>
                <div class="drop-menu">
                    <a href="exam.html?type=JEE Main">JEE Main</a>
                    <a href="exam.html?type=JEE Advanced">JEE Advanced</a>
                    <a href="exam.html?type=NEET">NEET</a>
                </div>
            </div>

            <div class="nav-item-dropdown">
                <a tabindex="0" class="drop-trigger">Subjects ▾</a>
                <div class="drop-menu">
                    <a href="chapter.html?subject=Physics">Physics</a>
                    <span style="display:block; padding: 12px 16px 4px; font-size: 11px; font-weight: bold; color: var(--accent-blue); text-transform: uppercase;">Chemistry</span>
                    <a href="chapter.html?subject=Physical%20Chemistry" style="padding-left: 24px; font-size: 15px;">Physical Chemistry</a>
                    <a href="chapter.html?subject=Organic%20Chemistry" style="padding-left: 24px; font-size: 15px;">Organic Chemistry</a>
                    <a href="chapter.html?subject=Inorganic%20Chemistry" style="padding-left: 24px; font-size: 15px;">Inorganic Chemistry</a>
                    <a href="chapter.html?subject=Maths">Maths</a>
                    <span style="display:block; padding: 12px 16px 4px; font-size: 11px; font-weight: bold; color: var(--accent-blue); text-transform: uppercase;">Biology</span>
                    <a href="chapter.html?subject=Botany" style="padding-left: 24px; font-size: 15px;">Botany</a>
                    <a href="chapter.html?subject=Zoology" style="padding-left: 24px; font-size: 15px;">Zoology</a>
                </div>
            </div>

            <a href="test-setup.html" style="color: var(--accent-blue);">Mock Tests</a>
            <a href="search.html">Search</a>
            <a href="bookmarks.html">Bookmarks</a>
        </nav>
    </header>

    <!-- Sidebar Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const closeMenuBtn = document.getElementById('closeMenuBtn');
            const primaryNav = document.getElementById('primaryNav');
            
            if (!mobileMenuBtn || !primaryNav) return;

            let overlay = document.querySelector('.menu-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'menu-overlay';
                document.body.appendChild(overlay);
            }

            function toggleMenu() {
                const isOpen = primaryNav.classList.contains('open');
                if (isOpen) {
                    primaryNav.classList.remove('open');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                } else {
                    primaryNav.classList.add('open');
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden'; 
                }
            }

            mobileMenuBtn.addEventListener('click', toggleMenu);
            closeMenuBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);

            document.querySelectorAll('.drop-trigger').forEach(trigger => {
                const newTrigger = trigger.cloneNode(true);
                trigger.parentNode.replaceChild(newTrigger, trigger);
                newTrigger.addEventListener('click', function(e) {
                    e.preventDefault();
                    const dropMenu = this.nextElementSibling;
                    dropMenu.classList.toggle('mobile-open');
                });
            });
        });
    </script>
    <!-- ========================================== -->

    <main class="container">
        <div class="setup-card">
            <h2 style="text-align: center; color: var(--text-primary); margin-bottom: 25px; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Configure Practice Test</h2>
            
            <div class="setup-tabs">
                <button class="tab-btn active" onclick="switchMode('pyq')">PYQ Paper Mode</button>
                <button class="tab-btn" onclick="switchMode('custom')">Custom Practice</button>
            </div>

            <!-- PYQ Mode -->
            <div id="pyqMode" class="setup-section active">
                <div class="input-group">
                    <label>Select Target Exam</label>
                    <select id="pyqExam">
                        <option value="JEE Main">JEE Main</option>
                        <option value="JEE Advanced">JEE Advanced</option>
                        <option value="NEET">NEET</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Select Exam Year</label>
                    <select id="pyqYear">
                        <option value="">Loading available years...</option>
                    </select>
                </div>
            </div>

            <!-- Custom Mode -->
            <div id="customMode" class="setup-section">
                <div class="input-group">
                    <label>Select Target Exam</label>
                    <select id="customExam">
                        <option value="All">All Exams</option>
                        <option value="JEE Main">JEE Main</option>
                        <option value="JEE Advanced">JEE Advanced</option>
                        <option value="NEET">NEET</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Select Subject</label>
                    <select id="customSubject">
                        <option value="All">All Subjects</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Select Chapter</label>
                    <select id="customChapter">
                        <option value="All">Loading available chapters...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Difficulty Level</label>
                    <select id="customDifficulty">
                        <option value="All">Mixed Difficulty</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

                <!-- Live Counter and Question Input -->
                <div id="availableCounter" class="live-counter">
                    <span>Available Questions: <strong id="maxCountDisplay">0</strong></span>
                </div>

                <div class="input-group">
                    <label>How many questions do you want to practice?</label>
                    <input type="number" id="practiceCount" min="1" value="10" disabled>
                </div>
            </div>

            <!-- GLOBAL TIME LIMIT (Applies to both modes) -->
            <div class="input-group" style="border-top: 1px solid var(--border-color); padding-top: 24px; margin-top: 15px;">
                <label>Test Duration</label>
                <select id="testDuration">
                    <option value="15">15 Minutes (Quick Practice)</option>
                    <option value="30">30 Minutes (Half Test)</option>
                    <option value="60" selected>1 Hour (Standard)</option>
                    <option value="180">3 Hours (Full Paper)</option>
                    <option value="custom">Custom Timer...</option>
                </select>
                
                <!-- Hidden input for Custom Minutes -->
                <input type="number" id="customMinutes" placeholder="Enter custom minutes (e.g., 45)" min="1" style="display: none; margin-top: 10px;">
            </div>

            <button class="start-btn" id="startTestBtn" disabled>Loading Database...</button>
            <p id="setupError" style="color: #EF4444; text-align: center; margin-top: 15px; font-weight: 600; font-size: 14px; height: 20px;"></p>
        </div>
    </main>

    <script type="module">
        import { getQuestions } from "./js/firebase.js";
        
        let allQuestions = []; 

        window.switchMode = function(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.setup-section').forEach(sec => sec.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(mode + 'Mode').classList.add('active');
            document.getElementById('setupError').textContent = ""; 
        };

        const pyqExamSelect = document.getElementById('pyqExam');
        const pyqYearSelect = document.getElementById('pyqYear');
        const customExamSelect = document.getElementById('customExam');
        const subjectSelect = document.getElementById('customSubject');
        const chapterSelect = document.getElementById('customChapter');
        const diffSelect = document.getElementById('customDifficulty');
        
        const practiceCountInput = document.getElementById('practiceCount');
        const availableCounterBox = document.getElementById('availableCounter');
        const maxCountDisplay = document.getElementById('maxCountDisplay');
        const startBtn = document.getElementById('startTestBtn');
        const errorText = document.getElementById('setupError');
        
        const testDurationSelect = document.getElementById('testDuration');
        const customMinutesInput = document.getElementById('customMinutes');

        testDurationSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customMinutesInput.style.display = 'block';
            } else {
                customMinutesInput.style.display = 'none';
                errorText.textContent = ""; 
            }
        });

        function updateSubjects() {
            const selectedExam = customExamSelect.value;
            const currentSubject = subjectSelect.value; 

            let html = '<option value="All">All Subjects</option>';
            html += '<option value="Physics">Physics</option>';
            html += `<optgroup label="Chemistry">
                        <option value="Physical Chemistry">Physical Chemistry</option>
                        <option value="Organic Chemistry">Organic Chemistry</option>
                        <option value="Inorganic Chemistry">Inorganic Chemistry</option>
                    </optgroup>`;

            if (selectedExam === "All") {
                html += '<option value="Maths">Maths</option>';
                html += `<optgroup label="Biology">
                            <option value="Botany">Botany</option>
                            <option value="Zoology">Zoology</option>
                        </optgroup>`;
            } else if (selectedExam === "JEE Main" || selectedExam === "JEE Advanced") {
                html += '<option value="Maths">Maths</option>';
            } else if (selectedExam === "NEET") {
                html += `<optgroup label="Biology">
                            <option value="Botany">Botany</option>
                            <option value="Zoology">Zoology</option>
                        </optgroup>`;
            }

            subjectSelect.innerHTML = html;

            const optionExists = Array.from(subjectSelect.options).some(opt => opt.value === currentSubject);
            if (optionExists) {
                subjectSelect.value = currentSubject;
            } else {
                subjectSelect.value = "All";
            }
            
            updateCustomChapters();
        }

        document.addEventListener("DOMContentLoaded", async () => {
            updateSubjects();
            try {
                allQuestions = await getQuestions();
                
                updatePyqYears();
                updateCustomChapters();
                updateLiveCounter(); 
                
                startBtn.textContent = "Start CBT Simulator";
                startBtn.disabled = false;
            } catch (err) {
                console.error(err);
                startBtn.textContent = "Database Error";
                errorText.textContent = "Failed to load database. Check your connection.";
            }
        });

        function getFilteredCustomQuestions() {
            const targetExam = customExamSelect.value;
            const targetSubject = subjectSelect.value;
            const targetChapter = chapterSelect.value;
            const targetDiff = diffSelect.value;
            
            return allQuestions.filter(q => {
                let match = true;
                if (targetExam !== "All" && q.exam !== targetExam) match = false;
                if (targetSubject !== "All" && q.subject !== targetSubject) match = false;
                if (targetChapter !== "All" && q.chapter !== targetChapter) match = false;
                if (targetDiff !== "All" && q.difficulty !== targetDiff) match = false;
                return match;
            });
        }

        function updateLiveCounter() {
            const availableCount = getFilteredCustomQuestions().length;
            maxCountDisplay.textContent = availableCount;

            if (availableCount === 0) {
                availableCounterBox.classList.add('error');
                practiceCountInput.disabled = true;
                practiceCountInput.value = 0;
            } else {
                availableCounterBox.classList.remove('error');
                practiceCountInput.disabled = false;
                practiceCountInput.max = availableCount;
                
                if (Number(practiceCountInput.value) > availableCount || Number(practiceCountInput.value) === 0) {
                    practiceCountInput.value = availableCount > 10 ? 10 : availableCount;
                }
            }
        }

        function updatePyqYears() {
            const selectedExam = pyqExamSelect.value;
            const availableYears = [...new Set(allQuestions
                .filter(q => q.exam === selectedExam && q.year)
                .map(q => String(q.year))
            )].sort((a, b) => b - a);

            pyqYearSelect.innerHTML = '';
            
            if (availableYears.length === 0) {
                pyqYearSelect.innerHTML = '<option value="">No questions uploaded yet</option>';
                pyqYearSelect.disabled = true;
            } else {
                pyqYearSelect.disabled = false;
                availableYears.forEach(year => {
                    const opt = document.createElement('option');
                    opt.value = year;
                    opt.textContent = year;
                    pyqYearSelect.appendChild(opt);
                });
            }
        }
        
        pyqExamSelect.addEventListener('change', updatePyqYears);

        function updateCustomChapters() {
            const selectedSubject = subjectSelect.value;
            let availableChapters = [];
            
            if (selectedSubject === "All") {
                const targetExam = customExamSelect.value;
                availableChapters = [...new Set(allQuestions
                    .filter(q => (targetExam === "All" || q.exam === targetExam) && q.chapter)
                    .map(q => q.chapter)
                )].sort();
            } else {
                availableChapters = [...new Set(allQuestions
                    .filter(q => q.subject === selectedSubject && q.chapter)
                    .map(q => q.chapter)
                )].sort();
            }

            chapterSelect.innerHTML = '<option value="All">All Available Chapters</option>';
            
            if (availableChapters.length === 0) {
                chapterSelect.innerHTML = '<option value="All">No chapters uploaded yet</option>';
                chapterSelect.disabled = true;
            } else {
                chapterSelect.disabled = false;
                availableChapters.forEach(chapter => {
                    const opt = document.createElement('option');
                    opt.value = chapter;
                    opt.textContent = chapter;
                    chapterSelect.appendChild(opt);
                });
            }
            updateLiveCounter(); 
        }

        customExamSelect.addEventListener('change', () => {
            updateSubjects();
            updateLiveCounter();
        });
        subjectSelect.addEventListener('change', updateCustomChapters);
        chapterSelect.addEventListener('change', updateLiveCounter);
        diffSelect.addEventListener('change', updateLiveCounter);
        
        practiceCountInput.addEventListener('input', (e) => {
            const max = parseInt(e.target.max);
            let val = parseInt(e.target.value);
            if (val > max) e.target.value = max;
            if (val < 1) e.target.value = 1;
        });

        startBtn.addEventListener('click', () => {
            errorText.textContent = "";
            const isPyq = document.getElementById('pyqMode').classList.contains('active');
            let filtered = [];

            if (isPyq) {
                const targetExam = pyqExamSelect.value;
                const targetYear = pyqYearSelect.value;
                
                if (!targetYear) {
                    errorText.textContent = "Please select a valid year.";
                    return;
                }
                
                filtered = allQuestions.filter(q => (q.exam === targetExam) && (String(q.year) === targetYear));
            } else {
                filtered = getFilteredCustomQuestions();
                
                if (filtered.length === 0) {
                    errorText.textContent = "No questions found for this exact selection!";
                    return;
                }

                const requestedCount = parseInt(practiceCountInput.value);
                filtered = filtered.sort(() => 0.5 - Math.random()).slice(0, requestedCount);
            }

            if (filtered.length === 0) {
                errorText.textContent = "No questions found!";
                return;
            }

            let timeSelected = testDurationSelect.value;
            if (timeSelected === 'custom') {
                timeSelected = parseInt(customMinutesInput.value);
                if (!timeSelected || timeSelected < 1) {
                    errorText.textContent = "Please enter a valid number of minutes for the custom timer.";
                    return;
                }
            }

            const questionIds = filtered.map(q => q.docId || q.id);

            sessionStorage.setItem('df_cbt_test', JSON.stringify(questionIds));
            sessionStorage.setItem('df_cbt_duration', timeSelected);
            
            window.location.href = "cbt.html";
        });
    </script>
