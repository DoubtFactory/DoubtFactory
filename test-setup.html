<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Setup | Doubt Factory</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .setup-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 600px; margin: 40px auto; border-top: 6px solid #1565C0; }
        .setup-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; border: 2px solid #e2e8f0; background: #f8fafc; border-radius: 8px; cursor: pointer; font-weight: bold; color: #64748b; font-size: 15px; transition: 0.2s; }
        .tab-btn:hover { border-color: #cbd5e1; }
        .tab-btn.active { border-color: #1565C0; background: #eff6ff; color: #1565C0; }
        .setup-section { display: none; animation: fadeIn 0.3s ease; }
        .setup-section.active { display: block; }
        .input-group { margin-bottom: 18px; }
        .input-group label { font-weight: 600; margin-bottom: 8px; display: block; color: #334155; font-size: 14px; }
        
        /* Unified inputs and selects for a clean look */
        .input-group select, .input-group input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 15px; color: #0f172a; background: #fff; outline: none; box-sizing: border-box; }
        .input-group select:focus, .input-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .input-group select:disabled, .input-group input:disabled { background: #f1f5f9; cursor: not-allowed; color: #94a3b8; }
        
        .start-btn { width: 100%; background: #10b981; color: white; padding: 16px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .start-btn:hover { background: #059669; transform: translateY(-2px); }
        .start-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        
        /* Live Counter Styling */
        .live-counter { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        .live-counter.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo">
            <h2>Doubt Factory</h2>
            <p>Turning Doubts into Clarity</p>
        </a>
    </header>

    <main class="container">
        <div class="setup-card">
            <h2 style="text-align: center; color: #0f172a; margin-bottom: 25px; font-size: 24px;">Configure Practice Test</h2>
            
            <div class="setup-tabs">
                <button class="tab-btn active" onclick="switchMode('pyq')">PYQ Paper Mode</button>
                <button class="tab-btn" onclick="switchMode('custom')">Custom Practice</button>
            </div>

            <!-- PYQ Mode -->
            <div id="pyqMode" class="setup-section active">
                <div class="input-group">
                    <label>Select Target Exam</label>
                    <select id="pyqExam">
                        <option value="JEE Main">JEE Main</option>
                        <option value="JEE Advanced">JEE Advanced</option>
                        <option value="NEET">NEET</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Select Exam Year</label>
                    <select id="pyqYear">
                        <option value="">Loading available years...</option>
                    </select>
                </div>
            </div>

            <!-- Custom Mode -->
            <div id="customMode" class="setup-section">
                <div class="input-group">
                    <label>Select Subject</label>
                    <select id="customSubject">
                        <option value="All">All Chemistry Branches</option>
                        <option value="Physical Chemistry">Physical Chemistry</option>
                        <option value="Organic Chemistry">Organic Chemistry</option>
                        <option value="Inorganic Chemistry">Inorganic Chemistry</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Select Chapter</label>
                    <select id="customChapter">
                        <option value="All">Loading available chapters...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Difficulty Level</label>
                    <select id="customDifficulty">
                        <option value="All">Mixed Difficulty</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

                <!-- NEW: Live Counter and Question Input -->
                <div id="availableCounter" class="live-counter">
                    <span>Available Questions: <strong id="maxCountDisplay">0</strong></span>
                </div>

                <div class="input-group">
                    <label>How many questions do you want to practice?</label>
                    <input type="number" id="practiceCount" min="1" value="10" disabled>
                </div>
            </div>

            <!-- GLOBAL TIME LIMIT (Applies to both modes) -->
            <div class="input-group" style="border-top: 1px solid #e2e8f0; padding-top: 20px; margin-top: 10px;">
                <label>Test Duration</label>
                <select id="testDuration">
                    <option value="15">15 Minutes (Quick Practice)</option>
                    <option value="30">30 Minutes (Half Test)</option>
                    <option value="60" selected>1 Hour (Standard)</option>
                    <option value="180">3 Hours (Full Paper)</option>
                </select>
            </div>

            <button class="start-btn" id="startTestBtn" disabled>Loading Database...</button>
            <p id="setupError" style="color: #dc2626; text-align: center; margin-top: 15px; font-weight: 600; font-size: 14px; height: 20px;"></p>
        </div>
    </main>

    <script type="module">
        import { getQuestions } from "./js/firebase.js";
        
        let allQuestions = []; 

        window.switchMode = function(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.setup-section').forEach(sec => sec.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(mode + 'Mode').classList.add('active');
            document.getElementById('setupError').textContent = ""; 
        };

        const pyqExamSelect = document.getElementById('pyqExam');
        const pyqYearSelect = document.getElementById('pyqYear');
        const subjectSelect = document.getElementById('customSubject');
        const chapterSelect = document.getElementById('customChapter');
        const diffSelect = document.getElementById('customDifficulty');
        
        // New elements for custom selection
        const practiceCountInput = document.getElementById('practiceCount');
        const availableCounterBox = document.getElementById('availableCounter');
        const maxCountDisplay = document.getElementById('maxCountDisplay');
        const startBtn = document.getElementById('startTestBtn');
        const errorText = document.getElementById('setupError');

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                allQuestions = await getQuestions();
                
                updatePyqYears();
                updateCustomChapters();
                updateLiveCounter(); // Trigger the counter check immediately
                
                startBtn.textContent = "Start CBT Simulator";
                startBtn.disabled = false;
            } catch (err) {
                console.error(err);
                startBtn.textContent = "Database Error";
                errorText.textContent = "Failed to load database. Check your connection.";
            }
        });

        // Calculate available custom questions based on live filters
        function getFilteredCustomQuestions() {
            const targetSubject = subjectSelect.value;
            const targetChapter = chapterSelect.value;
            const targetDiff = diffSelect.value;
            
            return allQuestions.filter(q => {
                let match = true;
                if (targetSubject !== "All" && q.subject !== targetSubject) match = false;
                if (targetChapter !== "All" && q.chapter !== targetChapter) match = false;
                if (targetDiff !== "All" && q.difficulty !== targetDiff) match = false;
                return match;
            });
        }

        // Update the UI showing how many questions exist
        function updateLiveCounter() {
            const availableCount = getFilteredCustomQuestions().length;
            maxCountDisplay.textContent = availableCount;

            if (availableCount === 0) {
                availableCounterBox.classList.add('error');
                practiceCountInput.disabled = true;
                practiceCountInput.value = 0;
            } else {
                availableCounterBox.classList.remove('error');
                practiceCountInput.disabled = false;
                practiceCountInput.max = availableCount;
                
                // If they previously typed 50 but only 20 exist, lower it to 20
                if (Number(practiceCountInput.value) > availableCount || Number(practiceCountInput.value) === 0) {
                    practiceCountInput.value = availableCount > 10 ? 10 : availableCount;
                }
            }
        }

        function updatePyqYears() {
            const selectedExam = pyqExamSelect.value;
            const availableYears = [...new Set(allQuestions
                .filter(q => q.exam === selectedExam && q.year)
                .map(q => String(q.year))
            )].sort((a, b) => b - a);

            pyqYearSelect.innerHTML = '';
            
            if (availableYears.length === 0) {
                pyqYearSelect.innerHTML = '<option value="">No questions uploaded yet</option>';
                pyqYearSelect.disabled = true;
            } else {
                pyqYearSelect.disabled = false;
                availableYears.forEach(year => {
                    const opt = document.createElement('option');
                    opt.value = year;
                    opt.textContent = year;
                    pyqYearSelect.appendChild(opt);
                });
            }
        }
        
        pyqExamSelect.addEventListener('change', updatePyqYears);

        function updateCustomChapters() {
            const selectedSubject = subjectSelect.value;
            let availableChapters = [];
            
            if (selectedSubject === "All") {
                availableChapters = [...new Set(allQuestions.filter(q => q.chapter).map(q => q.chapter))].sort();
            } else {
                availableChapters = [...new Set(allQuestions
                    .filter(q => q.subject === selectedSubject && q.chapter)
                    .map(q => q.chapter)
                )].sort();
            }

            chapterSelect.innerHTML = '<option value="All">All Available Chapters</option>';
            
            if (availableChapters.length === 0) {
                chapterSelect.innerHTML = '<option value="All">No chapters uploaded yet</option>';
                chapterSelect.disabled = true;
            } else {
                chapterSelect.disabled = false;
                availableChapters.forEach(chapter => {
                    const opt = document.createElement('option');
                    opt.value = chapter;
                    opt.textContent = chapter;
                    chapterSelect.appendChild(opt);
                });
            }
            updateLiveCounter(); // Re-check count after chapter updates
        }

        // Add event listeners to all custom filters to trigger the live counter
        subjectSelect.addEventListener('change', updateCustomChapters);
        chapterSelect.addEventListener('change', updateLiveCounter);
        diffSelect.addEventListener('change', updateLiveCounter);
        
        // Prevent typing a number higher than available
        practiceCountInput.addEventListener('input', (e) => {
            const max = parseInt(e.target.max);
            let val = parseInt(e.target.value);
            if (val > max) e.target.value = max;
            if (val < 1) e.target.value = 1;
        });

        // Launch Test Logic
        startBtn.addEventListener('click', () => {
            const isPyq = document.getElementById('pyqMode').classList.contains('active');
            let filtered = [];

            if (isPyq) {
                const targetExam = pyqExamSelect.value;
                const targetYear = pyqYearSelect.value;
                
                if (!targetYear) {
                    errorText.textContent = "Please select a valid year.";
                    return;
                }
                
                filtered = allQuestions.filter(q => (q.exam === targetExam) && (String(q.year) === targetYear));
            } else {
                filtered = getFilteredCustomQuestions();
                
                if (filtered.length === 0) {
                    errorText.textContent = "No questions found for this exact selection!";
                    return;
                }

                // Shuffle first, THEN slice down to the exact amount the student requested!
                const requestedCount = parseInt(practiceCountInput.value);
                filtered = filtered.sort(() => 0.5 - Math.random()).slice(0, requestedCount);
            }

            if (filtered.length === 0) {
                errorText.textContent = "No questions found!";
                return;
            }

            const questionIds = filtered.map(q => q.docId || q.id);
            const timeSelected = document.getElementById('testDuration').value;

            sessionStorage.setItem('df_cbt_test', JSON.stringify(questionIds));
            sessionStorage.setItem('df_cbt_duration', timeSelected);
            
            window.location.href = "cbt.html";
        });
    </script>
</body>
</html>
