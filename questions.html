<body id="home-body">
    <a class="skip-link" href="#mainContent" style="position: absolute; left: -9999px;">Skip to main content</a>

    <!-- ==========================================
         UNIVERSAL HEADER & SIDEBAR 
         ========================================== -->
    <header class="site-header">
        <a href="index.html" class="logo">
            <h2>Doubt Factory</h2>
            <p>Turning Doubts into Clarity</p>
        </a>

        <!-- Hamburger Icon -->
        <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open Menu">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <!-- Sidebar Navigation -->
        <nav aria-label="Primary navigation" id="primaryNav">
            <button id="closeMenuBtn" class="close-menu-btn" aria-label="Close Menu">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <a href="index.html">Home</a>
            
            <div class="nav-item-dropdown">
                <a tabindex="0" class="drop-trigger">Exams ▾</a>
                <div class="drop-menu">
                    <a href="exam.html?type=JEE Main">JEE Main</a>
                    <a href="exam.html?type=JEE Advanced">JEE Advanced</a>
                    <a href="exam.html?type=NEET">NEET</a>
                </div>
            </div>

            <div class="nav-item-dropdown">
                <a tabindex="0" class="drop-trigger">Subjects ▾</a>
                <div class="drop-menu">
                    <a href="chapter.html?subject=Physics">Physics</a>
                    <span style="display:block; padding: 12px 16px 4px; font-size: 11px; font-weight: bold; color: var(--accent-blue); text-transform: uppercase;">Chemistry</span>
                    <a href="chapter.html?subject=Physical%20Chemistry" style="padding-left: 24px; font-size: 15px;">Physical Chemistry</a>
                    <a href="chapter.html?subject=Organic%20Chemistry" style="padding-left: 24px; font-size: 15px;">Organic Chemistry</a>
                    <a href="chapter.html?subject=Inorganic%20Chemistry" style="padding-left: 24px; font-size: 15px;">Inorganic Chemistry</a>

        </nav>

    <!-- Sidebar Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const closeMenuBtn = document.getElementById('closeMenuBtn');
            const primaryNav = document.getElementById('primaryNav');
            
            if (!mobileMenuBtn || !primaryNav) return;

            let overlay = document.querySelector('.menu-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'menu-overlay';
                document.body.appendChild(overlay);
            }

            function toggleMenu() {
                const isOpen = primaryNav.classList.contains('open');
                if (isOpen) {
                    primaryNav.classList.remove('open');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                } else {
                    primaryNav.classList.add('open');
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden'; 
                }
            }

            mobileMenuBtn.addEventListener('click', toggleMenu);
            closeMenuBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);

            document.querySelectorAll('.drop-trigger').forEach(trigger => {
                const newTrigger = trigger.cloneNode(true);
                trigger.parentNode.replaceChild(newTrigger, trigger);
                newTrigger.addEventListener('click', function(e) {
                    e.preventDefault();
                    const dropMenu = this.nextElementSibling;
                    dropMenu.classList.toggle('mobile-open');
                });
            });
        });
    </script>
    <!-- ========================================== -->

    <main id="mainContent" class="container" style="max-width: 1000px; margin-top: 20px; min-height: 60vh;">

        <h1 id="chapterTitle">Loading...</h1>

        <div class="filters" aria-label="Question filters">
            <label class="sr-only" for="examFilter">Filter by exam</label>
            <select id="examFilter" aria-label="Filter by exam">
                <option value="All">All Exams</option>
                <option>JEE Main</option>
                <option>JEE Advanced</option>
                <option>NEET</option>
            </select>

            <label class="sr-only" for="yearFilter">Filter by year</label>
            <select id="yearFilter" aria-label="Filter by year">
                <option value="All">All Years</option>
            </select>

            <label class="sr-only" for="difficultyFilter">Filter by difficulty</label>
            <select id="difficultyFilter" aria-label="Filter by difficulty">
                <option value="All">All Difficulty</option>
                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>
            </select>
        </div>

        <label class="sr-only" for="searchQuestion">Search questions in this chapter</label>
        <input
            type="text"
            id="searchQuestion"
            class="search-question"
            placeholder="🔍 Search questions in this chapter..."
            aria-label="Search questions in this chapter">

        <div id="questionList" style="display: flex; flex-direction: column; gap: 15px;"></div>

    </main>

    <script type="module" src="js/questions.js"></script>

</body>
</html>
