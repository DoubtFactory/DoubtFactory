<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Doubt Factory</title>

    <link rel="stylesheet" href="css/main.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f62fe,#3b82f6);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:420px;
            background:#fff;
            padding:40px;
            border-radius:18px;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
        }

        h1{
            text-align:center;
            color:#0f62fe;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:18px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#0f62fe;
            color:white;
            font-size:17px;
            cursor:pointer;
        }

        button:hover{
            background:#0047c6;
        }

        #error{
            color:red;
            margin-top:15px;
            text-align:center;
        }
    </style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231565C0'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='Arial, sans-serif' font-size='46' font-weight='bold' fill='white'>DF</text></svg>">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T43GPM3CQJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-T43GPM3CQJ');
</script>
</head>

<body>

<div class="login-card">

<h1>Doubt Factory</h1>

<p>Administrator Login</p>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<div id="error"></div>

</div>

<script type="module" src="js/login.js"></script>
<script type="module" src="js/theme.js"></script>
</body>
</html>
