<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Simulator | Doubt Factory</title>
    <style>
        /* Strict NTA-Style CSS Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #fff; overflow: hidden; }
        
        /* Header */
        .nta-header { background: #2563eb; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .timer-box { font-size: 18px; font-weight: bold; background: #1e40af; padding: 5px 15px; border-radius: 4px; }
        
        /* Layout */
        .cbt-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* Left Panel: Question Area */
        .question-panel { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #cbd5e1; }
        .question-content { flex: 1; padding: 30px; overflow-y: auto; font-size: 16px; line-height: 1.6; }
        .option-label { display: block; padding: 10px; margin: 5px 0; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; }
        .option-label:hover { background: #f8fafc; }
        
        /* Left Panel: Action Buttons */
        .action-bar { padding: 15px 20px; background: #f1f5f9; border-top: 1px solid #cbd5e1; display: flex; justify-content: space-between; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .btn-save { background: #10b981; }
        .btn-review { background: #8b5cf6; }
        .btn-clear { background: #fff; color: #475569; border: 1px solid #cbd5e1; }
        
        /* Right Panel: Palette */
        .palette-panel { width: 300px; background: #f8fafc; display: flex; flex-direction: column; }
        .palette-header { padding: 15px; background: #e2e8f0; text-align: center; font-weight: bold; }
        .palette-grid { padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; overflow-y: auto; flex: 1; }
        
        /* NTA Bubble States */
        .q-bubble { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border-radius: 5px; color: white; }
        .state-unvisited { background: #cbd5e1; color: #333; }
        .state-unanswered { background: #ef4444; border-radius: 50%; padding-bottom: 5px; } /* Red Circle/Dome */
        .state-answered { background: #10b981; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); } /* Green Hexagon */
        .state-review { background: #8b5cf6; border-radius: 50%; } /* Purple Circle */
        .state-review-ans { background: #8b5cf6; border-radius: 50%; position: relative; }
        .state-review-ans::after { content: ''; position: absolute; bottom: 4px; right: 4px; width: 10px; height: 10px; background: #10b981; border-radius: 50%; }
        
        /* Submit Button */
        .submit-bar { padding: 15px; background: #e2e8f0; text-align: center; }
        .btn-submit-test { background: #3b82f6; width: 100%; }
            
                     
        /* =========================================
           MOBILE RESPONSIVENESS (NATURAL SCROLL)
           ========================================= */
        @media (max-width: 768px) {
            /* 1. Unlock the page so it can scroll naturally */
            body { height: auto !important; overflow: auto !important; display: block !important; }
            
            /* 2. Stack the header and make the timer stretch across the screen */
            .nta-header { flex-direction: column !important; padding: 15px !important; gap: 10px !important; text-align: center !important; }
            .timer-box { width: 100% !important; padding: 10px !important; font-size: 20px !important; }
            
            /* 3. Stack the main layout vertically */
            .cbt-layout { flex-direction: column !important; display: flex !important; height: auto !important; overflow: visible !important; }
            
            /* 4. Let the question content expand as much as it needs */
            .question-panel { width: 100% !important; flex: none !important; border-right: none !important; }
            .question-content { overflow-y: visible !important; height: auto !important; padding: 20px 15px !important; }
            
            /* 5. Wrap buttons into a chunky, touch-friendly grid */
            .action-bar { flex-wrap: wrap !important; gap: 10px !important; padding: 15px !important; border-top: 1px solid #cbd5e1 !important; border-bottom: 8px solid #e2e8f0 !important; }
            .action-bar .btn { flex: 1 1 45% !important; padding: 15px 5px !important; font-size: 14px !important; line-height: 1.3 !important; }
            .btn-clear { flex: 1 1 100% !important; order: 3 !important; } /* Pushes 'Clear' to the bottom row */
            
            /* 6. Fix the sideways numbering by using an auto-filling grid */
            .palette-panel { width: 100% !important; flex: none !important; height: auto !important; }
            .palette-grid { overflow-y: visible !important; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)) !important; padding: 20px !important; gap: 12px !important; justify-content: center !important; }
            .q-bubble { margin: 0 auto !important; width: 45px !important; height: 45px !important; font-size: 16px !important; }
        }


               </style>
</head>
<body>

    <header class="nta-header">
        <h2>Doubt Factory CBT Simulator</h2>
        <div class="timer-box">Time Left: <span id="timeDisplay">00:00:00</span></div>
    </header>

    <div class="cbt-layout">
        <!-- Left Side -->
        <div class="question-panel">
            <div class="question-content" id="qContent">
                <h3 style="color: #64748b; margin-bottom: 20px;">Loading Test Environment...</h3>
            </div>
            
            <div class="action-bar">
                <button class="btn btn-review" onclick="handleAction('review')">Mark for Review & Next</button>
                <button class="btn btn-clear" onclick="handleAction('clear')">Clear Response</button>
                <button class="btn btn-save" onclick="handleAction('save')">Save & Next</button>
            </div>
        </div>

        <!-- Right Side -->
        <div class="palette-panel">
            <div class="palette-header">Question Palette</div>
            <div class="palette-grid" id="paletteGrid"></div>
            <div class="submit-bar">
                <button class="btn btn-submit-test" onclick="submitTest()">Submit Test</button>
            </div>
        </div>
    </div>

      <script type="module">
        import { getQuestions } from "./js/firebase.js";

        let allQuestions = [];
        let testQuestions = [];
        let currentIndex = 0;
        let userResponses = []; 
        
        // 1. Load the test and the custom timer
        async function initTest() {
            const savedIds = JSON.parse(sessionStorage.getItem('df_cbt_test') || '[]');
            const savedDuration = parseInt(sessionStorage.getItem('df_cbt_duration') || '60', 10);

            if (savedIds.length === 0) {
                alert("No questions found. Redirecting to setup.");
                window.location.href = "test-setup.html";
                return;
            }

            try {
                allQuestions = await getQuestions();
                testQuestions = savedIds.map(id => allQuestions.find(q => (q.docId || q.id) === id)).filter(Boolean);
                
                userResponses = testQuestions.map(() => ({ selectedOption: null, state: 'unvisited' }));
                
                // Immediately update the display so there is no 1-second delay showing 00:00:00
                updateTimerDisplay(savedDuration * 60);
                
                startTimer(savedDuration * 60); 
                buildPalette();
                loadQuestion(0);
            } catch (err) {
                console.error(err);
            }
        }

        // 2. Build the right-side grid
        function buildPalette() {
            const grid = document.getElementById('paletteGrid');
            grid.innerHTML = '';
            userResponses.forEach((res, index) => {
                const bubble = document.createElement('div');
                bubble.textContent = index + 1;
                bubble.className = `q-bubble state-${res.state}`;
                bubble.onclick = () => loadQuestion(index);
                grid.appendChild(bubble);
            });
        }

                // 3. Render a specific question (NOW WITH IMAGES)
        window.loadQuestion = function(index) {
            if (userResponses[currentIndex].state === 'unvisited') {
                userResponses[currentIndex].state = 'unanswered';
            }
            
            currentIndex = index;
            const q = testQuestions[currentIndex];
            const content = document.getElementById('qContent');
            
            // 3A. Handle the Main Question Image
            let questionImageHTML = '';
            if (q.questionImage && q.questionImage.trim() !== '') {
                questionImageHTML = `<img src="${q.questionImage}" alt="Question Image" style="max-width: 100%; height: auto; margin: 15px 0; border-radius: 8px; border: 1px solid #e2e8f0;">`;
            }

            // 3B. Handle the Options (Text + Images)
            let optionsHTML = '';
            const optionLetters = ['A', 'B', 'C', 'D']; // Maps index 0-3 to database image keys

            q.options.forEach((optText, i) => {
                const isChecked = userResponses[currentIndex].selectedOption === i ? 'checked' : '';
                const letter = optionLetters[i];
                
                // Check if this specific option has an image attached
                let optImageHTML = '';
                if (q.optionImages && q.optionImages[letter] && q.optionImages[letter].trim() !== '') {
                    optImageHTML = `<img src="${q.optionImages[letter]}" alt="Option ${letter}" style="max-width: 250px; height: auto; display: block; margin-top: 8px; border-radius: 6px;">`;
                }

                // Only render text if it exists (prevents blank spaces)
                let optTextHTML = optText ? `<span style="font-size: 16px;">${optText}</span>` : '';

                optionsHTML += `
                    <label class="option-label" style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer;">
                        <input type="radio" name="cbtOption" value="${i}" ${isChecked} style="margin-top: 4px; width: 16px; height: 16px; cursor: pointer;">
                        <div style="flex: 1;">
                            ${optTextHTML}
                            ${optImageHTML}
                        </div>
                    </label>
                `;
            });

            content.innerHTML = `
                <div style="font-weight:bold; margin-bottom: 20px; font-size: 18px; color: #1e3a8a;">Question ${currentIndex + 1}</div>
                <div style="margin-bottom: 10px; font-size: 16px;">${q.question}</div>
                ${questionImageHTML}
                <div style="margin-top: 25px;">${optionsHTML}</div>
            `;
            
            buildPalette(); 
        }


        // 4. Handle Buttons
        window.handleAction = function(action) {
            const selected = document.querySelector('input[name="cbtOption"]:checked');
            const stateObj = userResponses[currentIndex];

            if (action === 'clear') {
                stateObj.selectedOption = null;
                stateObj.state = 'unanswered';
                loadQuestion(currentIndex); 
                return;
            }

            if (action === 'save') {
                if (selected) {
                    stateObj.selectedOption = Number(selected.value);
                    stateObj.state = 'answered';
                } else {
                    stateObj.state = 'unanswered';
                }
            }

            if (action === 'review') {
                if (selected) {
                    stateObj.selectedOption = Number(selected.value);
                    stateObj.state = 'review-ans';
                } else {
                    stateObj.state = 'review';
                }
            }

            if (currentIndex < testQuestions.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                buildPalette(); 
            }
        }

        // 5. Timer Logic
        function updateTimerDisplay(secondsTotal) {
            const hours = String(Math.floor(secondsTotal / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((secondsTotal % 3600) / 60)).padStart(2, '0');
            const seconds = String(secondsTotal % 60).padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
        }

        function startTimer(duration) {
            let timer = duration;
            setInterval(() => {
                if (--timer < 0) {
                    submitTest();
                } else {
                    updateTimerDisplay(timer);
                }
            }, 1000);
        }

        // 6. Submit to Scorecard
        window.submitTest = function() {
            const testData = {
                questions: testQuestions,
                responses: userResponses
            };
            
            sessionStorage.setItem('df_cbt_results', JSON.stringify(testData));
            window.location.href = "test-result.html"; 
        }

        document.addEventListener("DOMContentLoaded", initTest);
    </script>

</body>
</html>
