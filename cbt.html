<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBT Simulator | Doubt Factory</title>
    <meta name="description" content="Practice in a real exam environment with the Doubt Factory CBT Simulator.">
    <meta name="robots" content="noindex,follow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233B82F6'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='Arial, sans-serif' font-size='46' font-weight='bold' fill='white'>DF</text></svg>">
    
    <style>
        /* =========================================
           CBT SIMULATOR DARK THEME OVERRIDES
           ========================================= */
        body {
            background: var(--bg-main) !important;
            color: var(--text-primary);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Mobile browser viewport fix */
        }

        /* Top Bar */
        .cbt-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .cbt-brand h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px; }
        .cbt-timer {
            background: rgba(244, 63, 94, 0.1);
            color: #FB7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Layout */
        .cbt-layout {
            display: flex;
            flex: 1;
            overflow: hidden; /* Prevent body scroll on desktop */
        }

        /* Question Area (Left side) */
        .cbt-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 30px;
            background: var(--bg-main);
        }
        .cbt-q-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .cbt-q-header h3 { margin: 0; color: var(--accent-blue); font-size: 22px; font-weight: 800; }
        
        .cbt-q-text {
            font-size: 17px;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .cbt-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }
        .cbt-option-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 500;
            line-height: 1.4;
        }
        .cbt-option-label:hover { background: var(--bg-card-hover); border-color: rgba(59, 130, 246, 0.4); }
        .cbt-option-label input[type="radio"] {
            appearance: none;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            margin: 2px 0 0 0;
            display: grid;
            place-content: center;
        }
        .cbt-option-label input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 0.1s transform ease-in-out;
            box-shadow: inset 10px 10px var(--accent-blue);
        }
        .cbt-option-label input[type="radio"]:checked { border-color: var(--accent-blue); }
        .cbt-option-label input[type="radio"]:checked::before { transform: scale(1); }

        /* Action Buttons Bottom Bar */
        .cbt-actions {
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .cbt-btn {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
            min-width: 120px;
        }
        .btn-save { background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-save:hover { background: rgba(16, 185, 129, 0.25); }
        
        .btn-review { background: rgba(139, 92, 246, 0.15); color: #A78BFA; border: 1px solid rgba(139, 92, 246, 0.3); }
        .btn-review:hover { background: rgba(139, 92, 246, 0.25); }
        
        .btn-clear { background: var(--bg-card-hover); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-clear:hover { background: var(--border-color); color: var(--text-primary); }

        /* Palette Sidebar (Right side) */
        .cbt-sidebar {
            width: 320px;
            flex-shrink: 0;
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        
        .palette-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .palette-header h4 { margin: 0; color: var(--text-primary); font-size: 16px; }

        .palette-legend {
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-box { width: 20px; height: 20px; border-radius: 4px; display: inline-block; border: 1px solid rgba(255,255,255,0.1); }
        
        /* State Colors */
        .state-unvisited { background: var(--bg-card-hover); border-color: var(--border-color); }
        .state-unanswered { background: #ef4444; color: white; }
        .state-answered { background: #10b981; color: white; }
        .state-review { background: #8b5cf6; color: white; }
        .state-review-ans { background: #8b5cf6; color: white; position: relative; }
        .state-review-ans::after { content: ''; position: absolute; bottom: 3px; right: 3px; width: 6px; height: 6px; background: #10b981; border-radius: 50%; }

        .palette-grid-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .palette-btn {
            aspect-ratio: 1;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-card-hover);
            color: var(--text-primary);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .palette-btn:hover { transform: scale(1.05); }
        .palette-btn.active { box-shadow: 0 0 0 2px var(--bg-main), 0 0 0 4px var(--accent-blue); }

        .submit-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
        }
        .btn-submit {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #2563EB; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        /* Custom Modal */
        .cbt-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .cbt-modal {
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 30px; border-radius: var(--radius-lg); width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .cbt-modal h3 { color: var(--text-primary); margin-top: 0; font-size: 22px; }
        .cbt-modal p { color: var(--text-secondary); margin-bottom: 25px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 15px; justify-content: center; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; border: none; }
        .btn-cancel { background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border-color) !important; }
        .btn-confirm { background: var(--accent-blue); color: white; }

        /* =========================================
           MOBILE RESPONSIVENESS FIX
           ========================================= */
        @media (max-width: 900px) {
            .cbt-layout {
                flex-direction: column;
                overflow-y: auto; /* Allow the entire page to scroll */
            }
            .cbt-main {
                flex: 0 0 auto; /* Stop it from shrinking */
                min-height: min-content;
                overflow-y: visible; /* Prevent double scrollbars */
                padding: 20px;
            }
            .cbt-actions {
                margin-top: 30px; /* Provides space above action buttons */
            }
            .cbt-sidebar {
                width: 100%;
                flex: 0 0 auto;
                border-left: none;
                border-top: 4px solid var(--bg-card-hover);
            }
            .palette-grid-wrapper {
                overflow-y: visible; /* Let grid expand naturally */
            }
        }
    </style>
</head>
<body>

    <!-- Minimal Header specifically for CBT to avoid distraction -->
    <header class="cbt-header">
        <div class="cbt-brand">
            <h2>Doubt Factory Simulator</h2>
        </div>
        <div class="cbt-timer" id="timerDisplay">
            ⏱ 00:00:00
        </div>
    </header>

    <main class="cbt-layout" id="cbtScrollContainer">
        
        <!-- Left Panel: Question Display -->
        <div class="cbt-main">
            <div class="cbt-q-header">
                <h3 id="qNumDisplay">Question 1</h3>
            </div>
            
            <div class="cbt-q-text" id="qText">Loading question...</div>
            <div id="qImageContainer" style="margin-bottom: 20px;"></div>

            <div class="cbt-options" id="optionsContainer">
                <!-- Radio buttons injected by JS -->
            </div>

            <div class="cbt-actions">
                <button type="button" class="cbt-btn btn-clear" id="btnClear">Clear Response</button>
                <button type="button" class="cbt-btn btn-review" id="btnReview">Mark for Review & Next</button>
                <button type="button" class="cbt-btn btn-save" id="btnSaveNext">Save & Next</button>
            </div>
        </div>

        <!-- Right Panel: Palette & Submit -->
        <div class="cbt-sidebar">
            <div class="palette-header">
                <h4>Question Palette</h4>
            </div>
            
            <div class="palette-legend">
                <div class="legend-item"><span class="legend-box state-unvisited"></span> Not Visited</div>
                <div class="legend-item"><span class="legend-box state-unanswered"></span> Not Answered</div>
                <div class="legend-item"><span class="legend-box state-answered"></span> Answered</div>
                <div class="legend-item"><span class="legend-box state-review"></span> Marked Review</div>
            </div>
            <div class="palette-legend" style="border-top: none; padding-top: 0;">
                <div class="legend-item" style="grid-column: span 2;"><span class="legend-box state-review-ans"></span> Answered & Marked for Review</div>
            </div>

            <div class="palette-grid-wrapper">
                <div class="palette-grid" id="paletteGrid">
                    <!-- Palette buttons injected by JS -->
                </div>
            </div>

            <div class="submit-area">
                <button type="button" class="btn-submit" id="btnSubmitTest">Submit Test</button>
            </div>
        </div>
    </main>

    <!-- Submission Confirmation Modal -->
    <div class="cbt-modal-overlay" id="submitModal" style="display: none;">
        <div class="cbt-modal">
            <h3>Submit Test?</h3>
            <p>Are you sure you want to submit the test? You will not be able to change your answers after submission.</p>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="cancelSubmit">Resume Test</button>
                <button type="button" class="btn-confirm" id="confirmSubmit">Yes, Submit</button>
            </div>
        </div>
    </div>

    <!-- CBT Logic Script -->
    <script type="module" src="js/cbt.js"></script>

    <!-- Auto-Scroll to Top on Question Change for Mobile -->
    <script>
        document.addEventListener('click', (e) => {
            if (e.target.closest('.cbt-btn') || e.target.closest('.palette-btn')) {
                const scrollContainer = document.getElementById('cbtScrollContainer');
                if (scrollContainer && window.innerWidth <= 900) {
                    setTimeout(() => { scrollContainer.scrollTo({ top: 0, behavior: 'smooth' }); }, 50);
                }
            }
        });
    </script>
</body>
</html>
