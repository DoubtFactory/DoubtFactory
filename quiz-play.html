<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Practice Quiz | Doubt Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body { background: var(--bg-main); overflow-x: hidden; }
        
        /* Minimal Header for Focus */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .quiz-title { font-weight: 700; color: var(--text-primary); font-size: 16px; }
        .timer-badge { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-family: monospace; font-size: 16px; }
        
        .quiz-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        @media (max-width: 900px) { .quiz-layout { grid-template-columns: 1fr; } }

        /* Question Container */
        .question-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 30px; }
        .q-header { display: flex; justify-content: space-between; margin-bottom: 20px; color: var(--text-secondary); font-size: 14px; font-weight: 600; }
        .q-text { color: var(--text-primary); font-size: 18px; line-height: 1.6; margin-bottom: 25px; }
        .q-image { max-width: 100%; border-radius: 8px; margin-bottom: 20px; display: none; }

        /* Options */
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { display: flex; align-items: center; gap: 15px; background: var(--bg-main); border: 2px solid var(--border-color); padding: 15px 20px; border-radius: var(--radius-md); color: var(--text-primary); font-size: 16px; cursor: pointer; transition: 0.2s; text-align: left; }
        .option-btn:hover { border-color: var(--accent-blue); }
        .option-btn.selected { background: rgba(59, 130, 246, 0.1); border-color: var(--accent-blue); }
        .opt-label { font-weight: 700; color: var(--text-secondary); background: var(--bg-card); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .option-btn.selected .opt-label { background: var(--accent-blue); color: white; }

        /* Navigation */
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .btn-nav { padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); transition: 0.2s; }
        .btn-nav:hover:not(:disabled) { background: var(--bg-card); }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-next { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
        .btn-next:hover:not(:disabled) { background: #2563EB; }

        /* Palette / Status */
        .palette-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; height: fit-content; }
        .palette-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 15px; text-transform: uppercase; }
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 25px; }
        .palette-btn { width: 100%; aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .palette-btn.answered { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
        .palette-btn.current { border: 2px solid white; }
        
        .submit-btn { width: 100%; padding: 14px; background: #F97316; color: white; border: none; border-radius: var(--radius-md); font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background: #EA580C; }

        /* Loader */
        #loader { position: fixed; inset: 0; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: var(--text-primary); }
    </style>
</head>
<body>

    <div id="loader">
        <h2 style="margin-bottom: 10px;">Preparing Quiz...</h2>
        <p style="color: var(--text-secondary);">Fetching questions from database</p>
    </div>

    <header class="quiz-header">
        <div class="quiz-title" id="displayTopic">Loading Topic...</div>
        <div class="timer-badge" id="timerDisplay">00:00</div>
    </header>

    <main class="quiz-layout">
        <!-- Left: Question Area -->
        <div class="question-card">
            <div class="q-header">
                <span id="qCounter">Question 1 of -</span>
                <span style="color: var(--accent-blue); cursor: pointer;" id="clearSelectionBtn">Clear Selection</span>
            </div>
            
            <img id="qImage" class="q-image" src="" alt="Question Image">
            <div class="q-text" id="qText">Loading question content...</div>
            
            <div class="options-grid" id="optionsContainer">
                <!-- Options injected via JS -->
            </div>

            <div class="nav-buttons">
                <button class="btn-nav" id="btnPrev" disabled>← Previous</button>
                <button class="btn-nav btn-next" id="btnNext">Next →</button>
            </div>
        </div>

        <!-- Right: Status Palette -->
        <div class="palette-card">
            <div class="palette-title">Question Palette</div>
            <div class="palette-grid" id="paletteGrid">
                <!-- Palette buttons injected via JS -->
            </div>
            
            <div style="display: flex; gap: 15px; margin-bottom: 20px; font-size: 12px; color: var(--text-secondary);">
                <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 12px; height: 12px; background: var(--accent-blue); border-radius: 3px;"></div> Answered</div>
                <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 12px; height: 12px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 3px;"></div> Unanswered</div>
            </div>

            <button class="submit-btn" id="submitQuizBtn">Submit Quiz</button>
        </div>
    </main>

    <script type="module" src="js/quiz-play.js"></script>
</body>
</html>
