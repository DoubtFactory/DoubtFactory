<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Doubt Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .dashboard-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .dashboard-header { margin-bottom: 30px; }
        .dashboard-header h1 { color: var(--text-primary); font-size: 32px; margin: 0 0 5px 0; }
        .dashboard-header p { color: var(--text-secondary); margin: 0; font-size: 15px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 25px; text-align: center; }
        .stat-card h3 { color: var(--text-secondary); font-size: 14px; text-transform: uppercase; margin: 0 0 10px 0; }
        .stat-card .number { color: var(--accent-blue); font-size: 36px; font-weight: 800; margin: 0; }

        .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .action-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 30px; text-decoration: none; transition: 0.2s; display: flex; flex-direction: column; align-items: flex-start; }
        .action-card:hover { border-color: var(--accent-blue); transform: translateY(-3px); }
        .action-icon { width: 50px; height: 50px; background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 15px; }
        .action-card h2 { color: var(--text-primary); font-size: 20px; margin: 0 0 8px 0; }
        .action-card p { color: var(--text-secondary); font-size: 14px; margin: 0; line-height: 1.5; }
    </style>
</head>
<body id="home-body">

    <!-- You can paste your Universal Header here if you want navigation -->

    <main class="dashboard-container">
        <div class="dashboard-header">
            <h1>Admin Command Center</h1>
            <p>Welcome back. Here is an overview of your platform.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Questions</h3>
                <p class="number" id="statQuestions">--</p>
            </div>
            <div class="stat-card">
                <h3>Total Students</h3>
                <p class="number" id="statStudents">--</p>
            </div>
            <div class="stat-card">
                <h3>Mock Tests Taken</h3>
                <p class="number" id="statTests">--</p>
            </div>
        </div>

        <div class="actions-grid">
            <!-- Currently points to manage.html -->
            <a href="manage.html" class="action-card">
                <div class="action-icon">📋</div>
                <h2>Manage Questions</h2>
                <p>Edit, delete, or review your existing question bank database.</p>
            </a>
            
            <!-- We will need to build an upload.html next if you don't have one -->
            <a href="upload.html" class="action-card">
                <div class="action-icon">➕</div>
                <h2>Upload New Content</h2>
                <p>Add new JEE and NEET questions to the database.</p>
            </a>
        </div>
    </main>

    <script type="module">
        import { auth, onAuthStateChanged } from "./js/firebase.js";
        
        // Basic security check to ensure only you are here
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== "admin@doubtfactory.com") {
                window.location.href = "login.html"; 
            }
        });
    </script>
</body>
</html>
