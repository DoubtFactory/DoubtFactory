<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap Generator | Doubt Factory Admin</title>
    <style>
        body { font-family: sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; background: #f4f7f6; }
        h1 { color: #1565C0; }
        button { background: #1565C0; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        button:hover { background: #0d47a1; }
        textarea { width: 100%; height: 500px; padding: 15px; font-family: monospace; border: 2px solid #ccc; border-radius: 8px; font-size: 14px; background: white; }
    </style>
</head>
<body>

    <h1>🗺️ Generate XML Sitemap</h1>
    <p>Click the button below to fetch all questions from Firebase and generate the sitemap for Google Search Console.</p>
    
    <button id="generateBtn">Generate sitemap.xml</button>
    
    <textarea id="output" placeholder="Your XML code will appear here..."></textarea>

    <script type="module">
        import { getQuestions } from "./js/firebase.js";

        document.getElementById("generateBtn").addEventListener("click", async () => {
            const output = document.getElementById("output");
            output.value = "Fetching questions from database... please wait.";

            try {
                const questions = await getQuestions();
                const baseUrl = "https://doubtfactory.github.io/DoubtFactory";

                // Start building the XML string
                let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
                xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

                // 1. Add your static core pages
                const staticPages = ["index.html", "exam.html", "subject.html", "search.html"];
                staticPages.forEach(page => {
                    xml += `  <url>\n    <loc>${baseUrl}/${page}</loc>\n    <changefreq>weekly</changefreq>\n    <priority>1.0</priority>\n  </url>\n`;
                });

                // 2. Add every single dynamic question page
                questions.forEach(q => {
                    const id = q.docId || q.id;
                    const subject = encodeURIComponent(q.subject || "");
                    const chapter = encodeURIComponent(q.chapter || "");
                    
                    // Create the raw URL
                    const rawUrl = `${baseUrl}/question.html?id=${id}&subject=${subject}&chapter=${chapter}`;
                    
                    // XML requires ampersands (&) to be escaped as &amp;
                    const safeUrl = rawUrl.replace(/&/g, "&amp;");

                    xml += `  <url>\n    <loc>${safeUrl}</loc>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n`;
                });

                xml += `</urlset>`;
                
                // Display the final XML in the text box
                output.value = xml;

            } catch (error) {
                output.value = "Error generating sitemap: " + error.message;
            }
        });
    </script>
</body>
</html>
