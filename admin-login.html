<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Doubt Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body { background: var(--bg-main); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        .login-card h2 { color: var(--text-primary); margin-bottom: 10px; font-size: 24px; font-weight: 800; }
        .login-card p { color: var(--text-secondary); margin-bottom: 30px; font-size: 14px; line-height: 1.5; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input { width: 100%; padding: 12px 15px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); font-family: 'Inter', sans-serif; box-sizing: border-box; }
        .input-group input:focus { outline: none; border-color: var(--accent-blue); }
        
        .btn-admin { width: 100%; padding: 12px; background: var(--accent-blue); color: white; border: none; border-radius: var(--radius-md); font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-admin:hover { background: #2563EB; }

        #errorMsg { color: #EF4444; font-size: 13px; margin-top: 15px; display: none; font-weight: 500; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Doubt Factory Admin</h2>
        <p>Sign in with your admin credentials to manage platform content.</p>

        <div class="input-group">
            <input type="email" id="emailInput" placeholder="Admin Email Address">
        </div>
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="Password">
        </div>
        
        <button id="emailLoginBtn" class="btn-admin">Access Portal</button>

        <div id="errorMsg"></div>
    </div>

    <script type="module">
        import { auth } from "./js/firebase.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        document.addEventListener("DOMContentLoaded", () => {
            const emailBtn = document.getElementById("emailLoginBtn");
            const errorMsg = document.getElementById("errorMsg");

            emailBtn.addEventListener("click", async () => {
                const email = document.getElementById("emailInput").value.trim();
                const pass = document.getElementById("passwordInput").value;
                
                if(!email || !pass) {
                    errorMsg.textContent = "Please enter both email and password.";
                    errorMsg.style.display = "block";
                    return;
                }

                try {
                    emailBtn.textContent = "Authenticating...";
                    await signInWithEmailAndPassword(auth, email, pass);
                    // Redirect straight to your upload dashboard on success
                    window.location.href = "manage.html"; 
                } catch (error) {
                    emailBtn.textContent = "Access Portal";
                    errorMsg.textContent = "Invalid admin credentials. Please try again.";
                    errorMsg.style.display = "block";
                    console.error("Login Error:", error);
                }
            });
            
            // Allow pressing "Enter" to submit
            document.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    emailBtn.click();
                }
            });
        });
    </script>
</body>
</html>
