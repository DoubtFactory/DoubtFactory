<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Doubt Factory</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .contact-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; margin: 40px auto; border-top: 6px solid #1565C0; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; font-size: 14px; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; box-sizing: border-box; }
        .input-group input:focus, .input-group textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .input-group textarea { resize: vertical; min-height: 130px; }
        .submit-btn { width: 100%; background: #10b981; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background: #059669; transform: translateY(-2px); }
        .status-msg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; height: 20px; }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo">
            <h2>Doubt Factory</h2>
            <p>Turning Doubts into Clarity</p>
        </a>
    </header>

    <main class="container">
        <div class="contact-card">
            <h2 style="text-align: center; color: #0f172a; margin-bottom: 10px; font-size: 24px;">Get in Touch</h2>
            <p style="text-align: center; color: #64748b; margin-bottom: 25px; font-size: 14px;">Have a suggestion, found a bug, or want a specific chapter added? Let us know!</p>
            
            <form id="contactForm">
                <div class="input-group">
                    <label>Your Name (Optional)</label>
                    <input type="text" id="senderName" placeholder="How should we address you?">
                </div>
                <div class="input-group">
                    <label>Message / Suggestion *</label>
                    <textarea id="senderMessage" placeholder="Write your thoughts here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
                <div id="statusMsg" class="status-msg"></div>
            </form>
        </div>
    </main>
    <script type="module">
        import { db } from "./js/firebase.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMsg');
            
            const name = document.getElementById('senderName').value.trim() || "Anonymous Student";
            const message = document.getElementById('senderMessage').value.trim();

            btn.textContent = "Sending...";
            btn.disabled = true;
            status.textContent = "";

            try {
                await addDoc(collection(db, "messages"), {
                    name: name,
                    message: message,
                    timestamp: Date.now()
                });
                
                status.style.color = "#10b981";
                status.textContent = "Message sent successfully! Thank you.";
                document.getElementById('contactForm').reset();
            } catch (error) {
                console.error("Error sending message: ", error);
                status.style.color = "#ef4444";
                
                // THIS WILL PRINT THE EXACT CAUSE OF THE ERROR TO YOUR SCREEN
                status.textContent = "Error: " + error.message; 
            } finally {
                btn.textContent = "Send Message";
                btn.disabled = false;
            }
        });
    </script>

    
</body>
</html>
